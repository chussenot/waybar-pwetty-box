# A SHA pin that nobody moves is a stale dependency wearing a security control's
# clothes. Dependabot is the half of the pinning convention that keeps it honest:
# it rewrites the SHA *and* the `# vX.Y.Z` comment beside it, so a review can see
# which version a pin actually became.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      # Conventional commits with a scope, same as every other commit here —
      # CI enforces the scope over the PR range, dependabot's PRs included.
      prefix: "build(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      # One PR for the patch/minor noise; majors stay separate, because a
      # femtovg or gtk-rs major is a render change to look at, not a bump.
      minor-and-patch:
        update-types: ["minor", "patch"]
